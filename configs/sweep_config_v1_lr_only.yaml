# Sweep 1: lr, batch size and epochs. Selected by ln(batch_size) - val_loss
# (validation split), so runs with different batch sizes are comparable.
#
# Run with:
#   uv run wandb sweep configs/sweep_config_v1_lr_only.yaml
#   uv run wandb agent <sweep-id> --count 30
program: src/model/sweep_train_lr_only.py
project: proteomiq-full-proteome-v1-lr-sweep
method: bayes
metric:
  name: gap_below_random
  goal: maximize
parameters:
  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001
  batch_size:
    values: [128, 256, 512]
  epochs:
    values: [100, 200, 400]
command:
  - uv
  - run
  - python
  - ${program}
