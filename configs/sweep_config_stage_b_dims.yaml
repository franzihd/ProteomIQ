# Sweep 2: hidden_dim / output_dim (only output_dim <= hidden_dim), with lr,
# batch size and epochs fixed from sweep 1. Selected by validation loss.
#
# Run with:
#   uv run wandb sweep configs/sweep_config_stage_b_dims.yaml
#   uv run wandb agent <sweep-id> --count 14
program: src/model/sweep_train_dims.py
project: proteomiq-full-proteome-stage-b-dims
method: grid
metric:
  name: best_val_loss
  goal: minimize
parameters:
  dims:
    values:
      - "256_128"
      - "256_256"
      - "512_128"
      - "512_256"
      - "512_512"
      - "1024_128"
      - "1024_256"
      - "1024_512"
      - "1024_1024"
      - "2048_128"
      - "2048_256"
      - "2048_512"
      - "2048_1024"
      - "2048_2048"
command:
  - uv
  - run
  - python
  - ${program}
