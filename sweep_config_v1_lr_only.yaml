# v1 sweep: joint search over lr, batch_size, and epochs. Projection
# dimensions stay fixed (see FIXED dict in sweep_train_lr_only.py) --
# that axis is left to the separate, AUROC-based Stage B search.
#
# Selects by gap_below_random = ln(batch_size) - val_loss (the maximum
# value observed per run), NOT raw val_loss -- val_loss's own
# random-guessing floor (ln(batch_size)) differs per batch_size candidate,
# so subtracting it out is required for a fair comparison across this
# sweep's batch_size values (same correction already validated once in
# this project's earlier grid search, see CLAUDE.md section 11e).
#
# This sweep never touches pathway AUROC or the test split -- selection is
# entirely within the validation split's InfoNCE loss, so there is no
# leakage risk.
#
# Run with:
#   uv run wandb sweep sweep_config_v1_lr_only.yaml
#   uv run wandb agent <sweep-id-printed-above> --count 30
program: src/model/sweep_train_lr_only.py
project: proteomiq-full-proteome-v1-lr-sweep
method: bayes
metric:
  name: gap_below_random
  goal: maximize
parameters:
  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001
  batch_size:
    values: [128, 256, 512]
  epochs:
    values: [100, 200, 400]
command:
  - uv
  - run
  - python
  - ${program}
