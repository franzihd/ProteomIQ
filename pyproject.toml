[project]
name = "proteomiq"
version = "0.1.0"
description = "Natural-language search over proteomics samples (bachelor thesis code)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "adjusttext>=1.4.0",
    "anthropic>=0.111.0",
    "fair-esm>=2.0.0",
    "goatools>=1.6.5",
    "gseapy>=1.3.0",
    "h5py>=3.16.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-curand-cu12",
    "nvidia-nccl-cu12",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "scikit-learn>=1.9.0",
    "streamlit>=1.58.0",
    "torch==2.6.0",
    "tqdm>=4.67.3",
    "transformers>=5.8.0",
    "umap-learn>=0.5.12",
    "wandb>=0.28.1",
]

[project.optional-dependencies]
data = [
    "cptac>=1.5.14",
]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
